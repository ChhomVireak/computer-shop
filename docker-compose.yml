services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-shop-ssr
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - NG_ALLOWED_HOSTS=*
    volumes:
      - ./data:/app/data
